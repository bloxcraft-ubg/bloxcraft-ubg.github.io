<h1 style="color: cyan">Loading...</h1>
<script>
  fetch("https://cdn.jsdelivr.net/gh/tharun9772/Bloxcraft-UBG@main/gameFiles/planet-clicker/index.html")
    .then(response => response.text())
    .then(html => {
      document.open();
      document.write(html);
      document.close();
    })
    .catch(err => {
      document.body.innerHTML = "<h1>Failed To Fetch Content</h1>";
      console.error(err);
    });
</script>
